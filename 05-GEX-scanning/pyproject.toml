[project]
name = "gex-scanning"
version = "0.2.0"
description = "Live gamma exposure (GEX) dashboard: American-option implied vol and gamma on the GPU with Numba CUDA, Theta Data quotes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "numba>=0.67.0",
    "numba-cuda[cu13]>=0.30.4",
    "numpy<2.5",
    "pandas>=2.3.3",
    "polars>=1.20",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.2",
    "quantlib>=1.43",
    "thetadata>=1.0.9",
    "tqdm>=4.70.1",
    "yfinance>=1.7.0",
]
